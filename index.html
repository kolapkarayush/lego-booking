<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L.E.G.O - Live every game out</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

  <!-- Navigation -->
  <nav class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <div class="text-2xl font-black text-emerald-600 tracking-tight">L.E.G.O</div>
    <div class="flex items-center gap-4">
      <button class="text-sm font-semibold text-slate-600 hover:text-slate-900">Sign In</button>
      <button onclick="openAddVenueModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">List Your Venue</button>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="bg-emerald-900 text-white py-12 px-6">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">Find and Book Nearby Sports Venues</h1>
      <p class="text-emerald-200 text-base mb-8">Football turfs, badminton courts, and cricket nets ready when you are.</p>
    </div>
  </header>

  <!-- Venue Grid -->
  <main class="max-w-6xl mx-auto px-6 py-10">
    <h2 class="text-xl font-bold mb-6 text-slate-800">Featured Venues Near You</h2>
    <div id="venueGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-slate-500 col-span-full text-center py-10">Loading venues from live database...</p>
    </div>
  </main>

  <!-- Booking Modal -->
  <div id="bookingModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 font-bold text-xl">✕</button>
      <h3 class="text-xl font-bold text-slate-900 mb-1" id="modalVenueName">Venue Name</h3>
      <p class="text-xs text-slate-500 mb-4" id="modalSport">Sport Type</p>
      
      <div class="bg-slate-50 rounded-xl p-4 mb-4 border border-slate-100">
        <div class="flex justify-between text-sm mb-2">
          <span class="text-slate-500">Selected Time:</span>
          <span class="font-bold text-emerald-600" id="modalSelectedTime">7:00 PM - 8:00 PM</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">Total Amount:</span>
          <span class="font-bold text-slate-900" id="modalPrice">₹0.00</span>
        </div>
      </div>

      <form onsubmit="handleBooking(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
          <input type="text" required class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
          <input type="tel" required class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition text-sm mt-4">Confirm & Pay</button>
      </form>
    </div>
  </div>

  <!-- Add Venue Modal -->
  <div id="addVenueModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeAddVenueModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 font-bold text-xl">✕</button>
      <h3 class="text-xl font-bold text-slate-900 mb-4">List Your Venue</h3>
      
      <form onsubmit="handleNewVenue(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Venue Name</label>
          <input type="text" id="newVenueName" required class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Sport (e.g., Football, Cricket)</label>
          <input type="text" id="newVenueSport" required class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Price per Hour (e.g., ₹800)</label>
          <input type="text" id="newVenuePrice" required class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Location</label>
          <input type="text" id="newVenueLocation" required class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Image URL</label>
          <input type="text" id="newVenueImage" placeholder="https://..." required class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm outline-none" />
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition text-sm mt-4">Add to Database</button>
      </form>
    </div>
  </div>

  <script>
    // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbxJiFSnLfibdwvLnGoY6BTp-D1PFjxQqMXF8lFLXggsNcK9aaugClDFIO0s1aoCPqz0FQ/exec";

    const modal = document.getElementById('bookingModal');
    const addVenueModal = document.getElementById('addVenueModal');
    let selectedSlot = '';
    let selectedVenue = '';
    let currentVenues = [];

    // 1. Fetch data from Google Sheets on page load
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Network response was not ok");
        currentVenues = await response.json();
        renderVenues(currentVenues);
      } catch (error) {
        console.error("Error loading database:", error);
        document.getElementById('venueGrid').innerHTML = '<p class="text-red-500 col-span-full text-center py-10">Error loading venues. Check console for details or ensure your Google Apps Script is deployed to "Anyone".</p>';
      }
    });

    // 2. Render cards dynamically
    function renderVenues(venues) {
      const grid = document.getElementById('venueGrid');
      grid.innerHTML = ''; 

      venues.forEach(venue => {
        const name = venue.Name || 'Unknown Venue';
        const sport = venue.Sport || 'General Sport';
        const price = venue.Price || '₹0';
        const loc = venue.Location || 'Location unavailable';
        const img = venue.Image || 'https://images.unsplash.com/photo-1575361204480-aadea25e6e68?w=800&q=80';

        const card = `
          <article class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition">
            <div class="h-44 relative bg-slate-200 overflow-hidden">
              <img src="${img}" alt="${sport}" class="w-full h-full object-cover" />
              <span class="absolute top-3 right-3 bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-sm">★ 4.8</span>
            </div>
            <div class="p-5">
              <div class="text-xs font-bold uppercase tracking-wider text-emerald-600 mb-1">${sport}</div>
              <h3 class="text-lg font-bold text-slate-900">${name}</h3>
              <p class="text-sm text-slate-500 mb-4">${loc}</p>
              <div class="border-t border-slate-100 pt-3 flex flex-col gap-3">
                <div class="flex flex-wrap gap-2">
                  <button onclick="openModal('6:00 PM', '${name}', '${price}', '${sport}')" class="px-2.5 py-1 text-xs font-semibold rounded-md border border-emerald-600 text-emerald-600 hover:bg-emerald-50">6:00 PM</button>
                  <button onclick="openModal('7:00 PM', '${name}', '${price}', '${sport}')" class="px-2.5 py-1 text-xs font-semibold rounded-md border border-emerald-600 text-emerald-600 hover:bg-emerald-50">7:00 PM</button>
                </div>
                <div class="flex items-center justify-between">
                  <div>
                    <span class="text-lg font-extrabold text-slate-900">${price}</span>
                    <span class="text-xs text-slate-500">/ hour</span>
                  </div>
                  <button onclick="openModal('7:00 PM', '${name}', '${price}', '${sport}')" class="bg-slate-900 hover:bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg transition">Book Slot</button>
                </div>
              </div>
            </div>
          </article>
        `;
        grid.innerHTML += card;
      });
    }

    // 3. Post new venue to Google Sheets
    async function handleNewVenue(e) {
      e.preventDefault();
      
      const newEntry = {
        Name: document.getElementById('newVenueName').value,
        Sport: document.getElementById('newVenueSport').value,
        Price: document.getElementById('newVenuePrice').value,
        Location: document.getElementById('newVenueLocation').value,
        Image: document.getElementById('newVenueImage').value
      };

      // Optimistically update the UI so the user sees it immediately
      currentVenues.push(newEntry);
      renderVenues(currentVenues);
      closeAddVenueModal();
      e.target.reset();

      // Send to Google Sheets in the background
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' }, // Bypass CORS preflight
          body: JSON.stringify(newEntry)
        });
      } catch (error) {
        console.error("Failed to save to Google Sheets:", error);
        alert("There was an issue saving to the database, but it is visible locally.");
      }
    }

    // 4. Modal and Utility Functions
    function openAddVenueModal() {
      addVenueModal.classList.remove('hidden');
      addVenueModal.classList.add('flex');
    }
    function closeAddVenueModal() {
      addVenueModal.classList.add('hidden');
      addVenueModal.classList.remove('flex');
    }
    function openModal(slot, venueName, price, sport) {
      selectedSlot = slot;
      selectedVenue = venueName;
      document.getElementById('modalSelectedTime').textContent = `${slot} - ${getNextHour(slot)}`;
      document.getElementById('modalVenueName').textContent = venueName;
      document.getElementById('modalPrice').textContent = price;
      document.getElementById('modalSport').textContent = sport;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
    function getNextHour(timeStr) {
      const [time, period] = timeStr.split(' ');
      const [hour, minute] = time.split(':');
      const nextHour = parseInt(hour) === 12 ? 1 : parseInt(hour) + 1;
      return `${nextHour}:${minute} ${period}`;
    }
    function handleBooking(e) {
      e.preventDefault(); 
      alert(`Booking confirmed for ${selectedSlot} at ${selectedVenue}!`);
      closeModal();
    }
  </script>
</body>
</html>
